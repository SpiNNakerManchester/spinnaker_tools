# This workflow will install Python dependencies, run tests, lint and rat with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Self Hosted Tests

on:
  push:
  schedule:
    - cron: '0 1 * * 1-5'

jobs:
  integration_tests:
    runs-on: self-hosted
    # 24 * 60 minutes
    timeout-minutes: 1440
    container:
        image: localhost:5000/python3.13:latest
    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.SPINNAKER_PAT }}
        path: spinnaker_tools

    - name: Checkout hardware tests
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.SPINNAKER_PAT }}
        repository: SpiNNakerManchester/SpiNNaker_hardware_tests
        path: hwtests

    - name: Setup
      run: |
        pip install spalloc
        mkdir ~/.config
        echo "[spalloc]" > ~/.config/spalloc
        echo "hostname = spinnaker.cs.man.ac.uk" >> ~/.config/spalloc
        echo "owner = Jenkins" >> ~/.config/spalloc
        echo "SPINN_INSTALL_DIR=${GITHUB_WORKSPACE}/spinnaker_tools_install" >> $GITHUB_ENV
        echo "SPINN_PATH=${GITHUB_WORKSPACE}/hwtests/board_tests" >> $GITHUB_ENV

    - name: Build and Test with GCC
      run: |
        // show compiler version
        arm-none-eabi-gcc --version

        // Build base and SCAMP with gcc
        make GNU=1 -C spinnaker_tools install
        make GNU=1 -C spinnaker_tools/scamp
        make GNU=1 -C spinnaker_tools/scamp install

        // Boot a SpiNN-5 board
        spalloc -c hwtests/board_tests/boot-bt {}

    - name: Build and Test with ARM Compiler
      run: |
        // show compiler version
        armcc --vsn

        // Build base and SCAMP with gcc
        make GNU=0 -C spinnaker_tools install
        make GNU=0 -C spinnaker_tools/scamp
        make GNU=0 -C spinnaker_tools/scamp install

        // Boot a SpiNN-5 board
        spalloc -c hwtests/board_tests/boot-bt {}

        make -C spinnaker_tools/bmp
